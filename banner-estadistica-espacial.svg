    <text x="0" y="72" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="750" letter-spacing="-1">Estadística Espacial</text>
    <text x="2" y="116" fill="#d8e8ed" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">Del territorio a la evidencia: patrones, modelos y decisiones</text>

