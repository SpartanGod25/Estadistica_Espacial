    <path d="M927 38l92 25 44 77-20 83-78 61-94-17-56-71 12-91z" fill="#0b2f49" stroke-width="2"/>
    <path d="M927 38l-16 83 56 45 96-26M911 121l-84-16M967 166l-2 118M1043 223l-76-57" fill="none" stroke-width="2"/>
