<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Estadística Espacial</title>
  <desc id="desc">Banner académico sobre análisis geoespacial, patrones, modelos y decisiones.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071526"/>
      <stop offset="0.5" stop-color="#123757"/>
      <stop offset="1" stop-color="#0c5963"/>
    </linearGradient>
    <radialGradient id="clusterA" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f4c95d" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#f4c95d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="clusterB" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#49c6b3" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#49c6b3" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#b9d9e5" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#background)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>

  <circle cx="150" cy="72" r="130" fill="url(#clusterA)" opacity="0.35"/>
  <circle cx="1090" cy="290" r="180" fill="url(#clusterB)" opacity="0.33"/>

